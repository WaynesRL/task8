---

services:
  gitlab:
    image: gitlab/gitlab-ce:19.1.3-ce.0
    container_name: gitlab
    environment:
        GITLAB_OMNIBUS_CONFIG: |
           external_url 'http://gitlab-server:8929'
           gitlab_rails['gitlab_shell_ssh_port'] = 2224
    ports:
       -  "8929:8929"
       -  "2224:22"
    volumes:
         -  "${GITLAB_HOME}/config:/etc/gitlab"
         -  "${GITLAB_HOME}/logs:/var/log/gitlab"
         -  "${GITLAB_HOME}/data:/var/opt/gitlab"
    networks:
       - task8_network

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    networks:
      - task8_network

networks:
   task8_network:
      driver: bridge

volumes:
  jenkins_home:

